<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hexx AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a12;--panel:rgba(255,255,255,.04);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.1);--tx:#f4eefa;--mu:#9a8fa8;--ac:#ff3d9a;--ac2:#8b5cf6;--code:#07050b;--r:16px}
:root[data-theme=light]{--bg:#faf6fc;--panel:rgba(20,0,40,.04);--panel2:rgba(20,0,40,.08);--line:rgba(20,0,40,.12);--tx:#1d1426;--mu:#6d6179;--code:#f0e9f6}
:root[data-theme=ocean]{--bg:#06121a;--ac:#22d3ee;--ac2:#3b82f6}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;
background-image:radial-gradient(60% 50% at 85% -10%,color-mix(in srgb,var(--ac) 22%,transparent),transparent),radial-gradient(50% 40% at -5% 110%,color-mix(in srgb,var(--ac2) 22%,transparent),transparent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{display:flex;height:100%;padding-top:env(safe-area-inset-top,0)}
aside{width:290px;flex:none;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--panel);backdrop-filter:blur(24px);border-right:1px solid var(--line);transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.btn{padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700}
.btn.ghost{background:var(--panel2);color:var(--tx)}
input.s,select,textarea.f,input.f{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:0}
select option{color:#000}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.ci{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.ci:hover,.ci.on{background:var(--panel2)}
.ci span.t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .ops{display:none;gap:2px}.ci:hover .ops,.ci.on .ops{display:flex}
.ic{padding:3px 5px;border-radius:6px;color:var(--mu);font-size:13px}.ic:hover{background:var(--panel2);color:var(--tx)}
.grp{font-size:12px;color:var(--mu);padding:8px 10px 2px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
header h2{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none}
#msgs{flex:1;overflow:auto;padding:24px 0 10px;scroll-behavior:smooth}
.w{max-width:780px;margin:0 auto;padding:0 18px}
.m{display:flex;gap:12px;margin-bottom:22px}
.av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--panel2)}
.m.a .av{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.bd{flex:1;min-width:0}
.m.u .bd .tx{background:var(--panel2);padding:10px 14px;border-radius:var(--r);display:inline-block;white-space:pre-wrap;max-width:100%}
.tx{line-height:1.7;overflow-wrap:anywhere}
.tx p{margin:0 0 10px}.tx ul,.tx ol{margin:0 0 10px 22px}.tx h1,.tx h2,.tx h3{margin:14px 0 8px;letter-spacing:-.01em}
.tx a{color:var(--ac)}.tx code{background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:.9em}
.tx pre{background:var(--code);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.tx pre .h{display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--line)}
.tx pre code{display:block;background:none;padding:12px;overflow:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.meta{display:flex;gap:4px;align-items:center;margin-top:4px;font-size:12px;color:var(--mu);opacity:0;transition:opacity .15s}
.m:hover .meta,.m:focus-within .meta{opacity:1}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--ac);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
.hero{text-align:center;margin:9vh auto 0;max-width:620px;padding:0 18px}
.hero h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.04em;font-weight:800;background:linear-gradient(120deg,var(--tx) 30%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);margin:10px 0 24px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qs button{padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;font-size:14px}
.qs button:hover{border-color:var(--ac)}
.comp{padding:8px 18px calc(14px + env(safe-area-inset-bottom,0))}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;padding:8px;border-radius:20px;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line)}
.box:focus-within{border-color:var(--ac)}
#in{flex:1;resize:none;border:0;background:none;outline:0;padding:9px 6px;max-height:180px;line-height:1.5}
.round{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none}
.round.rec{background:var(--ac);color:#fff}
.chips{max-width:780px;margin:0 auto 6px;display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;display:inline-flex;gap:6px;align-items:center;margin:0 6px 6px 0}.chip small{color:var(--mu)}.chip button{color:var(--mu)}body.drag .box{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.foot{text-align:center;font-size:11px;color:var(--mu);margin-top:8px}
dialog{margin:auto;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--tx);padding:22px;width:min(480px,92vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(max-width:820px){
aside{position:fixed;z-index:20;inset:0 auto 0 0;height:100%;transform:translateX(-100%);background:var(--bg)}
aside.open{transform:none}#menu{display:block}.qs{grid-template-columns:1fr}.meta{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>
<body>
<div id="app">
<aside id="side">
  <div class="brand"><div class="logo" id="logo"></div><span id="bn"></span></div>
  <button class="btn" id="new">+ New chat</button>
  <input class="s" id="q" placeholder="Search chats" aria-label="Search chats">
  <div id="list"></div>
  <div class="row" style="margin:0"><button class="btn ghost" id="set" style="flex:1">Settings</button><button class="btn ghost" id="thm" aria-label="Switch theme">◐</button></div>
</aside>
<main>
  <header><button class="ic" id="menu" aria-label="Menu">☰</button><h2 id="title"></h2>
  <button class="ic" id="exp">Export</button></header>
  <div id="msgs"></div>
  <div class="comp">
    <div class="chips" id="chips"></div>
    <div class="box">
      <button class="round ic" id="att" aria-label="Attach files or ZIP" title="Attach files or ZIP">📎</button>
      <button class="round ic" id="mic" aria-label="Voice input">🎤</button>
      <textarea id="in" rows="1" placeholder="Message Hexx AI…  (Enter to send, Shift+Enter for new line)"></textarea>
      <button class="round btn" id="send" aria-label="Send">➤</button>
    </div>
    <div class="foot" id="foot"></div>
  </div>
</main>
</div>

<dialog id="dlg">
  <h3>Settings</h3>
  <label>Groq API key</label>
  <input class="f" id="key" type="password" placeholder="gsk_..." autocomplete="off">
  <label>Model</label>
  <select id="model"></select>
  <label>Reply language</label>
  <select id="lang"><option value="auto">Auto (follow my language)</option><option value="hinglish">Always Hinglish</option><option value="english">Always English</option><option value="hindi">Always Hindi (Devanagari)</option></select>
  <label>System instructions (optional)</label>
  <textarea class="f" id="sys" rows="3" placeholder="e.g. Reply in Hinglish, keep answers short"></textarea>
  <label>Creativity: <b id="tv"></b></label>
  <input type="range" id="temp" min="0" max="1.5" step="0.1" style="width:100%">
  <label>Voice reply</label>
  <select id="tts"><option value="0">Off</option><option value="1">Read answers aloud</option></select>
  <div class="row">
    <button class="btn" id="save">Save</button>
    <button class="btn ghost" id="bk">Backup</button>
    <button class="btn ghost" id="rs">Restore</button>
    <button class="btn ghost" id="clr">Clear all data</button>
    <button class="btn ghost" id="cl">Close</button>
  </div>
</dialog>
<input type="file" id="file" accept=".json" hidden>
<input type="file" id="attin" multiple hidden>
<div id="toast"></div>
